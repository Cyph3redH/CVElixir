<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVElixir Threat Archive</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #0d1117; color: #c9d1d9; }
        h1 { color: #58a6ff; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #30363d; padding: 10px; text-align: left; }
        th { background: #161b22; }
        tr:hover { background: #1f242c; }
        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .badge-nvd { background: #238636; color: white; }
        .badge-exploit { background: #da3633; color: white; }
        .badge-hacker { background: #1f6feb; color: white; }
        .filters { margin-bottom: 20px; }
        .filters button { margin-right: 10px; padding: 8px 16px; background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; cursor: pointer; }
        .filters button.active { background: #58a6ff; color: #0d1117; }
        .error { color: #da3633; }
    </style>
</head>
<body>
    <h1>CVElixir Threat Archive</h1>
    <p>Всего записей: <strong id="total">0</strong></p>

    <div class="filters">
        <button data-source="all" class="active">Все</button>
        <button data-source="NVD">NVD</button>
        <button data-source="EXPLOIT_DB">ExploitDB</button>
        <button data-source="HACKER_NEWS">HackerNews</button>
    </div>

    <div id="error-message" class="error"></div>

    <table id="threats-table">
        <thead>
            <tr>
                <th>Источник</th>
                <th>Заголовок / ID</th>
                <th>Детали</th>
                <th>Дата</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <tr><td colspan="4">Загрузка...</td></tr>
        </tbody>
    </table>

    <script>
        const API_URL = '/';
        let currentSource = 'all';

        async function loadThreats(source = 'all') {
            const tableBody = document.getElementById('table-body');
            const totalSpan = document.getElementById('total');
            const errorDiv = document.getElementById('error-message');
            
            tableBody.innerHTML = '<tr><td colspan="4">Загрузка...</td></tr>';
            errorDiv.textContent = ''; // Очищает ошибки
            
            const url = source === 'all' ? API_URL : `${API_URL}?source=${source}`;
            
            try {
                const response = await fetch(url);
                
                // Проверяет что сервер ответил 200
                if (!response.ok) {
                    throw new Error(`Сервер ответил: ${response.status} ${response.statusText}`);
                }
                
                const data = await response.json();
                totalSpan.textContent = data.total;
                
                if (data.threats.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="4">Нет данных</td></tr>';
                    return;
                }
                
                tableBody.innerHTML = data.threats.map(t => {
                    let badgeClass = '';
                    if (t.source === 'NVD') badgeClass = 'badge-nvd';
                    else if (t.source === 'EXPLOIT_DB') badgeClass = 'badge-exploit';
                    else badgeClass = 'badge-hacker';
                    
                    let details = '—';
                    if (t.cvss_score) details = `CVSS: ${t.cvss_score}`;
                    else if (t.platform) details = `Платформа: ${t.platform}`;
                    
                    const date = t.published ? new Date(t.published).toLocaleDateString('ru-RU') : '—';
                    
                    return `
                        <tr>
                            <td><span class="badge ${badgeClass}">${t.source}</span></td>
                            <td><a href="${t.link}" target="_blank">${t.title}</a></td>
                            <td>${details}</td>
                            <td>${date}</td>
                        </tr>
                    `;
                }).join('');
                
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                tableBody.innerHTML = '<tr><td colspan="4">Ошибка загрузки данных</td></tr>';
                errorDiv.textContent = `Ошибка: ${error.message}. Проверьте, работает ли сервер.`;
            }
        }

        // Вешает обработчики на кнопки фильтров
        document.querySelectorAll('.filters button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSource = btn.dataset.source;
                loadThreats(currentSource);
            });
        });

        // Загружает данные при открытии страницы
        loadThreats();
    </script>
</body>
</html>
