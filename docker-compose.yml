services:
  redis:
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    image: redis:7-alpine
    container_name: cvelixir_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # Настройки Kafka
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: SASL_PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: SASL_PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: SASL_PLAINTEXT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_CFG_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      
      # Пользователи и пароли
      KAFKA_CLIENT_USERS: producer,consumer
      KAFKA_CLIENT_PASSWORDS: ${KAFKA_PRODUCER_PASSWORD},${KAFKA_CONSUMER_PASSWORD}
      KAFKA_CFG_SUPER_USERS: User:admin
      
      # Админ
      KAFKA_CFG_ADMIN_USER: admin
      KAFKA_CFG_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD}
      
    volumes:
      - kafka_data:/bitnami/kafka

  cvelixir:
    build: .
    container_name: cvelixir_bot
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - KAFKA_BROKER=kafka:9092
      - KAFKA_PRODUCER_PASSWORD=${KAFKA_PRODUCER_PASSWORD}
      - KAFKA_CONSUMER_PASSWORD=${KAFKA_CONSUMER_PASSWORD}
      - KAFKA_ADMIN_PASSWORD=${KAFKA_ADMIN_PASSWORD}
    depends_on:
      - redis
      - kafka
    volumes:
      - ./logs:/app/logs

volumes:
  kafka_data:
  redis_data: