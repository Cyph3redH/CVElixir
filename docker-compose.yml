services:
  redis:
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    image: redis:7-alpine
    container_name: cvelixir_redis
    restart: unless-stopped

  cvelixir:
    build: .
    container_name: cvelixir_bot
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - KAFKA_BROKER=kafka:9092
      - KAFKA_PRODUCER_PASSWORD=${KAFKA_PRODUCER_PASSWORD}
      - KAFKA_CONSUMER_PASSWORD=${KAFKA_CONSUMER_PASSWORD}
      - KAFKA_ADMIN_PASSWORD=${KAFKA_ADMIN_PASSWORD}
    depends_on:
      - redis
      - kafka
    volumes:
      - ./logs:/app/logs

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_OPTS: "-Djava.security.auth.login.config=/dev/null"

      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://localhost:9092
      KAFKA_LISTENERS: SASL_PLAINTEXT://0.0.0.0:9092
      KAFKA_SECURITY_INTER_BROKER_PROTOCOL: SASL_PLAINTEXT
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_SASL_PLAINTEXT_PLAIN_SASL_JAAS_CONFIG: |
        org.apache.kafka.common.security.plain.PlainLoginModule required \
        username="admin" \
        password="${KAFKA_ADMIN_PASSWORD}" \
        user_admin="${KAFKA_ADMIN_PASSWORD}" \
        user_producer="${KAFKA_PRODUCER_PASSWORD}" \
        user_consumer="${KAFKA_CONSUMER_PASSWORD}";
      KAFKA_ZOOKEEPER_SET_ACL: "true"
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_SUPER_USERS: "User:admin"
    depends_on:
      - zookeeper
    env_file:
      - .env